[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imaging-pipeline"
version = "0.1.0"
description = "Raw DICOM to quality-checked, analysis-ready imaging data, with a QC dashboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydicom>=2.4",
    "pandas>=2.0",
    "nibabel>=5.0",
    "heudiconv>=1.3",
    "dcm2niix>=1.0.20241211",  # PyPI wheel with the dcm2niix binary
    "antspyx>=0.5",  # defacing registration (Apache-2.0; used instead of FSL)
    "pydeface>=2.0",  # only for its face template and mask (MIT); FSL not needed
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
imaging-inventory = "imaging_pipeline.inventory:main"
imaging-bids = "imaging_pipeline.bids:main"
imaging-validate = "imaging_pipeline.validate:main"
imaging-deidentify = "imaging_pipeline.deidentify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
